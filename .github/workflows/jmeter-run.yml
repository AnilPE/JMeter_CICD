name: JMeter_Run

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-jmeter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk

      - name: Set environment variables
        run: |
          echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which javac))))" >> $GITHUB_ENV
          echo "$JAVA_HOME/bin" >> $GITHUB_PATH

      - name: Make JMeter executable
        run: chmod +x apache-jmeter-5.6.3/bin/jmeter

      - name: Run JMeter Test (CSVSample)
        run: |
          mkdir -p Results/tmp
          export PATH="$GITHUB_WORKSPACE/apache-jmeter-5.6.3/bin:$PATH"
          jmeter -n -t apache-jmeter-5.6.3/bin/examples/CSVSample.jmx \
            -l Results/tmp/results.jtl \
            -Jjmeter.save.saveservice.output_format=csv \
            -Jjmeter.save.saveservice.timestamp_format=ms \
            -Jjmeter.save.saveservice.default_delimiter=, \
            -Jjmeter.save.saveservice.assertion_results=none \
            -Jjmeter.save.saveservice.bytes=true \
            -Jjmeter.save.saveservice.label=true \
            -Jjmeter.save.saveservice.latency=true \
            -Jjmeter.save.saveservice.response_code=true \
            -Jjmeter.save.saveservice.response_message=true \
            -Jjmeter.save.saveservice.successful=true \
            -Jjmeter.save.saveservice.thread_name=true \
            -Jjmeter.save.saveservice.time=true \
            -Jjmeter.save.saveservice.connect_time=true

      - name: Generate HTML Report
        run: |
          export PATH="$GITHUB_WORKSPACE/apache-jmeter-5.6.3/bin:$PATH"
          jmeter -g Results/tmp/results.jtl -o Results/tmp/html-report

      - name: Rename and move results with timestamp
        run: |
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          mkdir -p Results/$TIMESTAMP
          mv Results/tmp/* Results/$TIMESTAMP/
          rm -rf Results/tmp

      - name: Commit results back to repo
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add Results/
          git commit -m "Add JMeter results on $(date '+%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push origin main

