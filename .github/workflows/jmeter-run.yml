name: JMeter_run

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types:
      - closed
  workflow_dispatch:

jobs:
  run-jmeter:
    # Only run on push to main or merged PRs
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    env:
      JMETER_HOME: ${{ github.workspace }}/apache-jmeter-5.6.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Java & dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk unzip

      - name: Download and Setup JMeter
        run: |
          curl -sL https://downloads.apache.org/jmeter/binaries/apache-jmeter-5.6.3.zip -o jmeter.zip
          unzip -o -q jmeter.zip
          chmod +x apache-jmeter-5.6.3/bin/jmeter

      - name: Set timestamp
        id: set-time
        run: echo "timestamp=$(date +'%Y-%m-%d_%H-%M-%S')" >> "$GITHUB_OUTPUT"

      - name: Run JMeter Test
        run: |
          export PATH="$JMETER_HOME/bin:$PATH"
          mkdir -p Results/${{ steps.set-time.outputs.timestamp }}
          jmeter -n \
            -t $JMETER_HOME/bin/examples/CSVSample.jmx \
            -l Results/${{ steps.set-time.outputs.timestamp }}/results.jtl \
            -Jjmeter.save.saveservice.output_format=csv \
            -Jjmeter.save.saveservice.timestamp_format=ms \
            -Jjmeter.save.saveservice.default_delimiter=,

      - name: Generate HTML Report
        run: |
          export PATH="$JMETER_HOME/bin:$PATH"
          jmeter -g Results/${{ steps.set-time.outputs.timestamp }}/results.jtl \
            -o Results/${{ steps.set-time.outputs.timestamp }}/html-report || echo "⚠️ Report generation failed."

      - name: Commit Results to Repository
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "github-actions"
          git add Results/${{ steps.set-time.outputs.timestamp }}
          git commit -m "Add JMeter results for ${{ steps.set-time.outputs.timestamp }}" || echo "No changes to commit"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
