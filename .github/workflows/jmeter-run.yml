name: JMeter_run

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-jmeter:
    runs-on: ubuntu-latest

    env:
      JMETER_HOME: ${{ github.workspace }}/apache-jmeter-5.6.3

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Java
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk

      - name: Set up JMeter binary permissions
        run: |
          chmod +x apache-jmeter-5.6.3/bin/jmeter

      - name: Run JMeter Test Plan
        run: |
          export PATH="$JMETER_HOME/bin:$PATH"
          mkdir -p Results/tmp
          jmeter -n \
            -t apache-jmeter-5.6.3/bin/examples/CSVSample.jmx \
            -l Results/tmp/results.jtl \
            -Jjmeter.save.saveservice.output_format=csv \
            -Jjmeter.save.saveservice.timestamp_format=ms \
            -Jjmeter.save.saveservice.default_delimiter=, \
            -Jjmeter.save.saveservice.assertion_results=none \
            -Jjmeter.save.saveservice.bytes=true \
            -Jjmeter.save.saveservice.label=true \
            -Jjmeter.save.saveservice.latency=true \
            -Jjmeter.save.saveservice.response_code=true \
            -Jjmeter.save.saveservice.response_message=true \
            -Jjmeter.save.saveservice.successful=true \
            -Jjmeter.save.saveservice.thread_name=true \
            -Jjmeter.save.saveservice.time=true \
            -Jjmeter.save.saveservice.connect_time=true

      - name: Debug: Check contents of Results/tmp
        run: |
          echo "🔍 Listing contents of Results/tmp:"
          ls -la Results/tmp || echo "❌ Results/tmp does not exist"

      - name: Generate HTML Report
        run: |
          export PATH="$JMETER_HOME/bin:$PATH"
          jmeter -g Results/tmp/results.jtl -o Results/tmp/html-report || echo "⚠️ Report generation skipped."

      - name: Timestamp results directory
        run: |
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          if [ -d Results/tmp ]; then
            mkdir -p Results/$TIMESTAMP
            shopt -s nullglob
            mv Results/tmp/* Results/$TIMESTAMP/ || echo "⚠️ No files to move."
            rm -rf Results/tmp
          else
            echo "⚠️ Results/tmp folder not found. Skipping move."
          fi

      - name: Upload Results as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-artifacts
          path: Results/
