name: JMeter_run

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-jmeter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Java
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk unzip

      - name: Install JMeter 5.6.3
        run: |
          curl -sL https://downloads.apache.org/jmeter/binaries/apache-jmeter-5.6.3.zip -o jmeter.zip
          unzip -o -q jmeter.zip
          chmod +x apache-jmeter-5.6.3/bin/jmeter

      - name: Run JMeter Test Plan
        run: |
          export PATH="$GITHUB_WORKSPACE/apache-jmeter-5.6.3/bin:$PATH"
          jmeter -n \
            -t TestScripts/JMX/CI-CD_JMeter_InfluxDb_Grafana.jmx \
            -l results.jtl \
            -Jjmeter.save.saveservice.output_format=csv \
            -Jjmeter.save.saveservice.timestamp_format=ms \
            -Jjmeter.save.saveservice.default_delimiter=, \
            -Jjmeter.save.saveservice.assertion_results=none \
            -Jjmeter.save.saveservice.bytes=true \
            -Jjmeter.save.saveservice.label=true \
            -Jjmeter.save.saveservice.latency=true \
            -Jjmeter.save.saveservice.response_code=true \
            -Jjmeter.save.saveservice.response_message=true \
            -Jjmeter.save.saveservice.successful=true \
            -Jjmeter.save.saveservice.thread_name=true \
            -Jjmeter.save.saveservice.time=true \
            -Jjmeter.save.saveservice.connect_time=true

      - name: Debug - View JTL Output
        run: |
          echo "----- JTL Output -----"
          cat results.jtl || echo "No JTL file generated."

      - name: Generate HTML Report
        run: |
          export PATH="$GITHUB_WORKSPACE/apache-jmeter-5.6.3/bin:$PATH"
          mkdir -p jmeter-report
          jmeter -g results.jtl -o jmeter-report || echo "Failed to generate HTML report."

      - name: Generate Aggregate Report (CSV)
        run: |
          java -jar cmdrunner-2.3.jar --tool Reporter \
            --generate-csv aggregate.csv \
            --input-jtl results.jtl \
            --plugin-type AggregateReport || echo "Aggregate report failed."

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-artifacts
          path: |
            results.jtl
            aggregate.csv
            jmeter-report/
