name: JMeter_run

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-jmeter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Java and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk unzip

      - name: Install JMeter 5.6.3
        run: |
          curl -sL https://downloads.apache.org/jmeter/binaries/apache-jmeter-5.6.3.zip -o jmeter.zip
          yes | unzip -o -q jmeter.zip

      - name: Run JMeter Test Plan
        run: |
          export PATH="$GITHUB_WORKSPACE/apache-jmeter-5.6.3/bin:$PATH"
          jmeter -n \
            -t TestScripts/JMX/CI-CD_JMeter_InfluxDb_Grafana.jmx \
            -l results.jtl \
            -Jjmeter.save.saveservice.output_format=csv \
            -Jjmeter.save.saveservice.timestamp_format=ms \
            -Jjmeter.save.saveservice.default_delimiter=, \
            -Jjmeter.save.saveservice.assertion_results_failure_message=true \
            -Jjmeter.save.saveservice.response_data=false \
            -Jjmeter.save.saveservice.samplerData=false \
            -Jjmeter.save.saveservice.url=true \
            -Jjmeter.save.saveservice.thread_counts=true

      - name: Output JTL file preview
        run: |
          echo "Results file size and sample:"
          ls -lh results.jtl
          head -40 results.jtl

      - name: Generate HTML Report
        run: |
          export PATH="$GITHUB_WORKSPACE/apache-jmeter-5.6.3/bin:$PATH"
          if [ -s results.jtl ]; then
            jmeter -g results.jtl -o jmeter-report
          else
            echo "results.jtl is empty or missing, skipping report generation"
            exit 1
          fi

      - name: Generate Aggregate CSV Report using CMDRunner
        run: |
          java -jar cmdrunner-2.3.jar --tool Reporter --generate-csv aggregate.csv --input-jtl results.jtl --plugin-type AggregateReport

      - name: Upload results as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-reports
          path: |
            results.jtl
            aggregate.csv
            jmeter-report
