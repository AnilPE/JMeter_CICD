name: JMeter_run

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-jmeter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Java and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk wget unzip

      - name: Install JMeter 5.6.3
        run: |
          curl -sL https://downloads.apache.org/jmeter/binaries/apache-jmeter-5.6.3.zip -o jmeter.zip
          unzip -o -q jmeter.zip

      - name: Run JMeter Test Plan
        run: |
          export PATH="$GITHUB_WORKSPACE/apache-jmeter-5.6.3/bin:$PATH"
          jmeter -n \
            -t apache-jmeter-5.6.3/bin/examples/CSVSample.jmx \
            -l results.jtl \
            -Jjmeter.save.saveservice.output_format=csv \
            -Jjmeter.save.saveservice.timestamp_format=ms \
            -Jjmeter.save.saveservice.default_delimiter=,

      - name: Generate HTML Report
        run: |
          export PATH="$GITHUB_WORKSPACE/apache-jmeter-5.6.3/bin:$PATH"
          mkdir -p jmeter-report
          jmeter -g results.jtl -o jmeter-report

      - name: Generate Aggregate CSV via CMDRunner
        run: |
          java -jar CMDRunner.jar \
            --tool Reporter \
            --generate-csv aggregate.csv \
            --input-jtl results.jtl \
            --plugin-type AggregateReport

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-artifacts
          path: |
            results.jtl
            aggregate.csv
            jmeter-report/
