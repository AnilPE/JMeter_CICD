name: JMeter_run

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-jmeter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Java
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk

      - name: Install JMeter 5.6.3
        run: |
          curl -sL https://downloads.apache.org/jmeter/binaries/apache-jmeter-5.6.3.zip -o jmeter.zip
          unzip -o -q jmeter.zip

      - name: Run JMeter Test
        run: |
          export PATH="$GITHUB_WORKSPACE/apache-jmeter-5.6.3/bin:$PATH"
          jmeter -n -t apache-jmeter-5.6.3/bin/examples/CSVSample.jmx -l results.jtl -Jjmeter.save.saveservice.output_format=csv

      - name: Show JTL contents (for debug)
        run: |
          echo "----- JTL Output -----"
          cat results.jtl || echo "results.jtl not found"

      - name: Generate Aggregate Report CSV (optional)
        run: |
          export PATH="$GITHUB_WORKSPACE/apache-jmeter-5.6.3/bin:$PATH"
          mkdir -p jmeter-report
          jmeter -g results.jtl -o jmeter-report || echo "Report generation skipped."
          if [ -f jmeter-report/statistics.csv ]; then
            cp jmeter-report/statistics.csv aggregate.csv
          else
            echo "No statistics.csv found. Report may be empty."
          fi

      - name: Upload JMeter Results
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results
          path: results.jtl

      - name: Upload Aggregate Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aggregate-report
          path: aggregate.csv
